# Installed as /etc/unbound/unbound.conf, in place of Fedora's. Andaru renders the whole DNS service, interfaces
# included, so this file only ties Unbound to the host, as Debian's minimal one did: Fedora's own binds 127.0.0.1,
# which Andaru's settings bind again, and Unbound refuses to bind an address twice.
server:
	chroot: ""
	auto-trust-anchor-file: "/var/lib/unbound/root.key"

remote-control:
	control-enable: yes
	# A local socket: only root, which runs unbound-control for Andaru, can use it, and it needs no certificates.
	control-interface: "/run/unbound/control"

include: "/etc/unbound/conf.d/*.conf"
