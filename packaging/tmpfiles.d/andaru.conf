# Installed as /usr/lib/tmpfiles.d/andaru.conf.
# Unbound refuses an include over a directory that does not exist.
d /run/andaru-kea      0755 root root -
d /run/andaru-unbound  0755 root root -
d /run/andaru-leases   0755 root root -
# PPPoE sessions' pppd options, which hold their passwords.
d /run/andaru-ppp      0700 root root -
d /run/andaru-web     0710 root andaru-web -
# The event bus socket for Andaru's unprivileged services, which are in this group.
d /run/andaru-services 0710 root andaru-services -
# Each Ethernet device's offloads as its driver set them this boot, which Andaru restores.
d /run/andaru-offloads 0755 root root -
# Boot-lifetime safe-mode and settings-hold flags (must survive andaru-engine restarts).
d /run/andaru-boot     0755 root root -
# Add-on runtime environment, secrets, and per-add-on bus token directories.
d /run/andaru-addons   0700 root root -
