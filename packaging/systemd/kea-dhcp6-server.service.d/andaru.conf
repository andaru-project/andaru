# Installed as /usr/lib/systemd/system/kea-dhcp6-server.service.d/andaru.conf.
# Kea serves only what Andaru's confirmed generation declares; without it Kea does not start.
[Unit]
ConditionPathExists=/run/andaru-kea/kea-dhcp6.conf

[Service]
ExecStart=
ExecStart=/usr/sbin/kea-dhcp6 -c /run/andaru-kea/kea-dhcp6.conf
# A start, at boot included, publishes the lease names and restores the delegated-prefix routes.
ExecStartPost=/usr/share/kea/scripts/andaru-lease-event
Restart=on-failure
RestartSec=5s
