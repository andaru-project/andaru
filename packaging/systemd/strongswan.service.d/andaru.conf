# Installed as /usr/lib/systemd/system/strongswan.service.d/andaru.conf.
# strongSwan runs only what Andaru's generation declares, from /run/andaru-ipsec; on a box with none it does not start.
[Unit]
After=andaru-network-boot.service systemd-networkd.service
ConditionPathExists=/run/andaru-ipsec/swanctl.conf

[Service]
ExecStartPost=/usr/bin/swanctl --load-all --file /run/andaru-ipsec/swanctl.conf --noprompt
