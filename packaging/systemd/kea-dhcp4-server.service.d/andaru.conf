# Installed as /usr/lib/systemd/system/kea-dhcp4-server.service.d/andaru.conf.
# Kea serves only what Andaru's confirmed generation declares; without it Kea does not start.
[Unit]
ConditionPathExists=/run/andaru-kea/kea-dhcp4.conf

[Service]
ExecStart=
ExecStart=/usr/sbin/kea-dhcp4 -c /run/andaru-kea/kea-dhcp4.conf
# A start, at boot included, publishes the lease names again.
ExecStartPost=/usr/share/kea/scripts/andaru-lease-event
# Kea exits when a served VLAN or bridge does not exist yet, which networkd may create after Kea starts at boot.
# 5s apart stays under the default start limit, so Kea starts whenever the interface appears.
Restart=on-failure
RestartSec=5s
