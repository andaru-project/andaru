name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install shellspec and shellcheck
        env:
          SHELLSPEC_VERSION: 0.28.1
          SHELLSPEC_SHA256: 350d3de04ba61505c54eda31a3c2ee912700f1758b1a80a284bc08fd8b6c5992
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/shellspec.tar.gz" \
            "https://github.com/shellspec/shellspec/releases/download/$SHELLSPEC_VERSION/shellspec-dist.tar.gz"
          echo "$SHELLSPEC_SHA256  $RUNNER_TEMP/shellspec.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellspec" >>"$GITHUB_PATH"
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          # Ahead of the runner's own shellcheck.
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >>"$GITHUB_PATH"

      # The release gate and the maintainer scripts are shell; their specs guard nothing unless they run.
      - name: shellcheck and shellspec
        run: |
          set -eu
          shellcheck --version
          shellcheck scripts/ci/*.sh packaging/apparmor/andaru-apparmor packaging/kea/andaru-lease-event \
            debian/andaru.*inst debian/andaru.*rm
          shellspec

  native-linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: Install nftables, Kea and Unbound for the packet filter and service tests (unit tests check the lease file with Unbound)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables kea-dhcp4-server kea-dhcp6-server unbound
          # The packaged AppArmor rules let kea-dhcp4 read /run/andaru-kea, where the tool test stages its files.
          if [ -d /etc/apparmor.d/local ] && command -v apparmor_parser >/dev/null; then
            sudo install -m 0644 -D -t /etc/apparmor.d/andaru packaging/apparmor/andaru/kea-dhcp4 packaging/apparmor/andaru/kea-dhcp6 packaging/apparmor/andaru/unbound
            sudo sh packaging/apparmor/andaru-apparmor
          fi
      - name: Vet and unprivileged tests
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go vet -tags=integration ./...
          go test ./...
          go test -race ./...

      - name: Build and run root integration suites
        shell: bash
        run: |
          set -euo pipefail
          build=$(mktemp -d)
          trap 'rm -rf -- "$build"' EXIT
          art=$(sudo mktemp -d /var/tmp/andaru-ci-XXXXXX)
          trap 'rm -rf -- "$build"; sudo rm -rf -- "$art"' EXIT
          CGO_ENABLED=0 go build -o "$build/andaru" ./cmd/andaru
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/config.test" ./internal/config
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/engine.test" ./internal/engine
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/ctl.test" ./cmd/andaru
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/render.test" ./internal/render
          sudo install -o root -g root -m 0755 -t "$art" \
            "$build/andaru" "$build/config.test" "$build/engine.test" "$build/ctl.test" "$build/render.test"
          sudo env -u TMPDIR "$art/config.test" -test.v -test.timeout=120s
          sudo env -u TMPDIR ANDARU_TEST_BINARY="$art/andaru" "$art/engine.test" -test.v -test.timeout=120s
          sudo env -u TMPDIR "$art/ctl.test" -test.v -test.timeout=120s
          # The pppd and networkd tool proofs in this binary are lab proofs; CI runs the filter ones.
          sudo env -u TMPDIR "$art/render.test" -test.v -test.timeout=120s -test.run "FilterInNamespace|NftScriptIsValid|ServiceGoldensPassTheirTools|DHCPv6GoldensPassKea"

  packages:
    name: packages ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the packages in Debian 13 and check them with lintian
        run: |
          sh scripts/ci/build-packages.sh dist any
          sh scripts/ci/build-packages.sh dist all

      - name: Install, check and upgrade in a Debian 13 container booted with systemd
        run: sh scripts/ci/install-test.sh dist
