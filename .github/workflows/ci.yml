name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install shellspec and shellcheck
        env:
          SHELLSPEC_VERSION: 0.28.1
          SHELLSPEC_SHA256: 350d3de04ba61505c54eda31a3c2ee912700f1758b1a80a284bc08fd8b6c5992
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -eu
          curl -fsSLo "$RUNNER_TEMP/shellspec.tar.gz" \
            "https://github.com/shellspec/shellspec/releases/download/$SHELLSPEC_VERSION/shellspec-dist.tar.gz"
          echo "$SHELLSPEC_SHA256  $RUNNER_TEMP/shellspec.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellspec" >>"$GITHUB_PATH"
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          # Ahead of the runner's own shellcheck.
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >>"$GITHUB_PATH"

      # The release gate and the lease hook are shell; their specs guard nothing unless they run.
      - name: shellcheck and shellspec
        run: |
          set -eu
          shellcheck --version
          shellcheck scripts/ci/*.sh packaging/kea/andaru-lease-event image/iso/andaru-install image/iso/render.sh image/iso/check-ign.sh image/iso/build.sh
          shellspec

      # Butane --strict refuses a config with any warning but reads no unit; check-ign.sh checks what they must do.
      - name: Render and check the install ISO's Ignition configs
        run: |
          set -eu
          for console in ttyS0 ttyAMA0; do
            sh image/iso/render.sh ghcr.io/andaru-project/andaru 0.0.0-ci "$console" "$RUNNER_TEMP/live-$console.ign"
            sh image/iso/check-ign.sh "$RUNNER_TEMP/live-$console.ign" ghcr.io/andaru-project/andaru 0.0.0-ci "$console"
          done

  frontend:
    name: browser client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the exact locked dependency graph without package scripts
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint, type-check, test and build local assets
        working-directory: web
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run build:netplane
          sh ../scripts/ci/npm-audit.sh

      - name: Set up Go for embedded Netplane UI build check
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify cmd/netplane embedui build
        run: |
          test -f web/dist-netplane/index.html
          go vet -tags=embedui ./cmd/netplane ./web
          CGO_ENABLED=0 go build -tags=embedui -o /tmp/netplane ./cmd/netplane
          rm -f /tmp/netplane

  native-linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: Install Unbound for the unprivileged lease-file test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unbound
      - name: Vet and unprivileged tests
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go vet -tags=integration ./...
          go test ./...
          go test -race ./...

      - name: Build and run root integration suites
        shell: bash
        run: |
          set -euo pipefail
          build=$(mktemp -d)
          trap 'rm -rf -- "$build"' EXIT
          art=$(sudo mktemp -d /var/tmp/andaru-ci-XXXXXX)
          trap 'rm -rf -- "$build"; sudo rm -rf -- "$art"' EXIT
          CGO_ENABLED=0 go build -o "$build/andaru" ./cmd/andaru
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/config.test" ./internal/config
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/engine.test" ./internal/engine
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/generation.test" ./internal/generation
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/identity.test" ./internal/identity
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/audit.test" ./internal/audit
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/ctl.test" ./cmd/andaru
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/render.test" ./internal/render
          CGO_ENABLED=0 go test -c -tags=integration -o "$build/reset.test" ./internal/reset
          sudo install -o root -g root -m 0755 -t "$art" \
            "$build/andaru" "$build/config.test" "$build/engine.test" "$build/generation.test" "$build/identity.test" \
            "$build/audit.test" "$build/ctl.test" "$build/render.test" "$build/reset.test"
          sudo install -o root -g root -m 0644 -t "$art" packaging/sysctl.d/50-andaru-proxy-arp.conf
          # They run where the image's packages are: Fedora's nftables, Kea and Unbound. A missing tool fails.
          # The PPPoE session test needs the kernel's PPP; a container cannot load modules.
          sudo modprobe -a ppp_generic pppoe
          sudo podman run --rm --privileged --network host -v "$art:$art" -v "$PWD/scripts/ci:/ci:ro" \
            registry.fedoraproject.org/fedora:44 sh /ci/root-tests.sh "$art"

  image:
    name: image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Proves the Containerfile still builds, lints and passes the smoke checks. Never pushed or signed.
      - name: Build and check the image
        env:
          VERSION: 0.0.0-pr${{ github.event.pull_request.number || '0' }}
        run: |
          set -eu
          podman build -f image/Containerfile --build-arg VERSION="$VERSION" -t andaru:ci .
          sh scripts/ci/rechunk.sh andaru:ci
          sh scripts/ci/image-smoke.sh andaru:ci "$VERSION"

  netplane-image:
    name: netplane image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Proves packaging/netplane/Containerfile still builds and serves. Never pushed or signed.
      - name: Build and check the Netplane image
        env:
          VERSION: 0.0.0-pr${{ github.event.pull_request.number || '0' }}
        run: |
          set -eu
          podman build -f packaging/netplane/Containerfile --build-arg VERSION="$VERSION" -t netplane:ci .
          sh scripts/ci/netplane-smoke.sh netplane:ci "$VERSION"
