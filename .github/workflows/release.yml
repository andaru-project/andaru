name: Release

# A pushed tag builds Andaru's image for both architectures, signs it with the image-release environment's cosign key,
# and only then gives it its version tag (and stable, for a release). Tags: v1.2.3, v1.2.3-a.N, -b.N or -rc.N (a prerelease).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Two tags pushed close together must not race for stable.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/andaru-project/andaru

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.map.outputs.version }}
      prerelease: ${{ steps.map.outputs.prerelease }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # All of main's history, for the ancestry check.
          fetch-depth: 0

      - name: Refuse a tag outside main
        run: |
          # Every box runs a release as its operating system, so only a commit already on main may become one.
          # HEAD is the tag's commit, also for an annotated tag.
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Map the tag
        id: map
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # On its own line, so that a tag version.sh refuses fails the workflow.
          mapped=$(sh scripts/ci/version.sh "$TAG")
          read -r version prerelease <<EOF
          $mapped
          EOF
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

      - name: Pin the base
        id: base
        # bash -e -o pipefail: a failed lookup must not hash empty output into a digest.
        shell: bash
        env:
          # A digest pin for the base, set as a repository variable when a Fedora CoreOS release must be avoided.
          FCOS_BASE: ${{ vars.FCOS_BASE }}
        run: |
          set -eu
          # One digest for both architectures: stable may move between the two builds.
          if [ -z "$FCOS_BASE" ]; then
            FCOS_BASE="quay.io/fedora/fedora-coreos@$(skopeo inspect --raw docker://quay.io/fedora/fedora-coreos:stable | sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/')"
          fi
          echo "base=$FCOS_BASE" >>"$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build and check
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          set -eu
          podman build -f image/Containerfile --build-arg VERSION="$VERSION" --build-arg BASE_IMAGE="$BASE" -t andaru:build .
          sh scripts/ci/rechunk.sh andaru:build
          sh scripts/ci/image-smoke.sh andaru:build "$VERSION"

      - name: Push the unsigned architecture image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Boxes never follow these tags: nothing signs them, so the signature policy refuses them.
          podman push --digestfile "digest-$ARCH" andaru:build "docker://$IMAGE:$VERSION-$ARCH"

      # The digest, not the tag, goes into the index: a tag could be moved between this push and the signature.
      - name: Keep the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}
          if-no-files-found: error

  sign:
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The cosign key is a secret of this environment, which admits only v* tags.
    environment: image-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Collect the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Install cosign
        run: |
          set -eu
          # cosign 2.6 stores the signature as a .sig attachment, the form containers/image verifies.
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign

      - name: Assemble, sign, then tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          printf '%s\n' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s\n' "$TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman manifest create andaru:index
          for arch in amd64 arm64; do
            podman manifest add andaru:index "docker://$IMAGE@$(cat "digest-$arch")"
          done
          # The index goes up under a staging tag nothing follows; its digest is what gets signed.
          podman manifest push --all --digestfile digest andaru:index "docker://$IMAGE:staging-$VERSION"
          digest=$(cat digest)
          # Recursive: a box pulls its own architecture's manifest, which needs a signature of its own.
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE@$digest"
          # The key in the image must verify what boxes will pull.
          cosign verify --key image/cosign.pub "$IMAGE@$digest" >/dev/null
          for arch in amd64 arm64; do
            cosign verify --key image/cosign.pub "$IMAGE@$(cat "digest-$arch")" >/dev/null
          done
          # Only a signed digest gets the names boxes follow.
          tags=$VERSION
          [ "$PRERELEASE" = true ] || tags="$tags stable"
          for tag in $tags; do
            skopeo copy --all --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:$tag"
          done
          echo "$IMAGE@$digest: $tags" >>"$GITHUB_STEP_SUMMARY"

  # The ISOs come after the signed tags: boxes can update from the release even while a failed ISO job waits for a rerun.
  iso:
    needs: [version, sign]
    # Nothing runs code of the target architecture (image/iso/build.sh), so both build here.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            iso: x86_64
          - arch: arm64
            iso: aarch64
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Collect the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Install xorriso
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xorriso

      - name: Build the ISO
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          ISO_ARCH: ${{ matrix.iso }}
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          # podman and skopeo share this login.
          printf '%s\n' "$TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Fails for an ISO of 2 GiB or more, which a release cannot hold.
          sh image/iso/build.sh "$IMAGE" "$VERSION" "$(cat "digest-$ARCH")" "$ISO_ARCH" "$(cat digest-amd64)" \
            "$RUNNER_TEMP/andaru-$VERSION-$ISO_ARCH.iso"

      - name: Keep the ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ matrix.iso }}
          path: ${{ runner.temp }}/andaru-${{ needs.version.outputs.version }}-${{ matrix.iso }}.iso
          if-no-files-found: error
          # An ISO is mostly compressed already.
          compression-level: 0

  publish:
    needs: [version, iso]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The cosign key is a secret of this environment, which admits only v* tags.
    environment: image-release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Collect the ISOs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: iso-*
          merge-multiple: true
          path: dist

      - name: Install cosign
        run: |
          set -eu
          curl -fsSLo cosign https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          echo "c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign

      - name: Sum and sign
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          sha256sum "andaru-$VERSION-x86_64.iso" "andaru-$VERSION-aarch64.iso" >SHA256SUMS
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          # The published key must verify what users download.
          cosign verify-blob --key ../image/cosign.pub --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Publish the release
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # A draft until every file is up; a rerun of a failed job finishes the same draft.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "Andaru $VERSION" --notes "Andaru $VERSION." \
              --prerelease="$PRERELEASE"
          gh release upload "$TAG" --clobber "andaru-$VERSION-x86_64.iso" "andaru-$VERSION-aarch64.iso" \
            SHA256SUMS SHA256SUMS.cosign.bundle
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE"
