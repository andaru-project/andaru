# An image's /var is not installed onto a running box, so the /var directories Fedora's packages create at install
# time are created at boot instead.
d /var/lib/openvpn 0770 openvpn openvpn -
d /var/log/kea     0750 kea     kea     -
d /var/log/ppp     0700 root    root    -
d /var/log/qemu-ga 0755 root    root    -
